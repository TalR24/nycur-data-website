name: Site Health

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays ~6-7am ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print report only, never email"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Crawl and check live site
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENT_ARCHIVE_DIR: ${{ runner.temp }}/sent
        run: |
          python3 site_health/check_site.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # The mention monitor commits state to the private repo daily. Silence
      # there is indistinguishable from a quiet week in the inbox, so check
      # it here: a failing run, a disabled schedule, or an expired credential
      # all show up as stale state.
      - name: Mention monitor freshness
        if: always()
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENT_ARCHIVE_DIR: ${{ runner.temp }}/sent
          MENTION_DIGEST_TO: ${{ secrets.MENTION_DIGEST_TO }}
        run: |
          pip install requests
          python3 mention_monitor/check_freshness.py --max-age-days 3 ${{ inputs.dry_run && '--dry-run' || '' }}

      # Post-deploy SEO verification of what production actually serves
      # (robots, sitemap, every sitemap URL's title/description/canonical) on
      # all three public sites. Emails only on ERROR-level findings.
      - name: SEO production check
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENT_ARCHIVE_DIR: ${{ runner.temp }}/sent
        run: |
          pip install requests
          python3 seo/seo_check.py --all --live ${{ inputs.dry_run && '' || '--email' }}

      # Nov 11 2026: file a copy of any alert this run emailed (shared/mailer.py writes them to
      # $RUNNER_TEMP/sent) in premium planning/sent/, so the monthly ops digest and Sunday email can
      # see what Tal was already told. Does nothing on a quiet run.
      - name: File sent alerts in the premium repo
        if: always() && !inputs.dry_run
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: |
          if [ -z "$(ls -A "$RUNNER_TEMP/sent" 2>/dev/null)" ]; then echo "No alerts sent."; exit 0; fi
          git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" "$RUNNER_TEMP/premium"
          mkdir -p "$RUNNER_TEMP/premium/planning/sent"
          cp "$RUNNER_TEMP"/sent/*.md "$RUNNER_TEMP/premium/planning/sent/"
          cd "$RUNNER_TEMP/premium"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add planning/sent
          git commit -q -m "Site health: file sent alerts $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep 20
          done
          echo "::warning::could not push the sent-alert copies"
