name: Mention Monitor

on:
  schedule:
    - cron: "30 11 * * *"   # daily ~6:30-7:30am ET; Sundays send the digest
  workflow_dispatch:
    inputs:
      backfill:
        description: "Seed the seen-db from ~90 days back (no digest, no email)"
        type: boolean
        default: false
      digest:
        description: "Build and write the digest from pending items"
        type: boolean
        default: false
      send_email:
        description: "Email the digest when it runs (implies digest; scheduled Sunday runs always email)"
        type: boolean
        default: false
      referrers_only:
        description: "Run only the Cloudflare referrer source and print its rows/error; no other source, no db writes"
        type: boolean
        default: false
      referrers_window_hours:
        description: "How far back referrers_only looks, in hours (default 24)"
        default: "24"

permissions:
  contents: read   # state commits go to the private repo via PREMIUM_PUSH_TOKEN

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r mention_monitor/requirements.txt

      - name: Run offline tests
        env:
          MENTION_MONITOR_SKIP_LIVE_TESTS: "1"
        run: python3 -m unittest discover -s mention_monitor -p "test_monitor.py" -v

      # State (seen.db, digests, discovered_sources.json) lives in the private
      # premium repo: digests list who cited Tal and must not be public.
      - name: Check out private state
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: |
          git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" "$RUNNER_TEMP/premium"
          mkdir -p "$RUNNER_TEMP/premium/mention_monitor_state/digests"
          echo "STATE_DIR=$RUNNER_TEMP/premium/mention_monitor_state" >> "$GITHUB_ENV"

      - name: Determine if today is Sunday
        id: day
        run: echo "is_digest_day=$([ "$(date -u +%u)" = "7" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run mention monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MENTION_DIGEST_TO: ${{ secrets.MENTION_DIGEST_TO }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GOOGLE_ALERT_FEEDS: ${{ secrets.GOOGLE_ALERT_FEEDS }}
        # referrers_only runs the Cloudflare referrer probe alone, nothing
        # else. Otherwise: digest fires on a scheduled Sunday run, or when
        # explicitly asked for via workflow_dispatch (inputs.digest), or
        # whenever send_email is requested (send_email implies digest,
        # since emailing with no digest built is a no-op). Email follows
        # the same Sunday/send_email rule. A manual dispatch on a Sunday
        # must NOT auto-add --digest/--email just because is_digest_day is true.
        run: |
          STATE_ARGS="--db $STATE_DIR/seen.db --outdir $STATE_DIR/digests --discovered-path $STATE_DIR/discovered_sources.json"
          if [ "${{ inputs.referrers_only }}" = "true" ]; then
            python3 mention_monitor/monitor.py $STATE_ARGS --referrers-only --referrers-window-hours ${{ inputs.referrers_window_hours || '24' }}
          else
            python3 mention_monitor/monitor.py $STATE_ARGS \
              ${{ inputs.backfill && '--backfill' || '' }} \
              ${{ (!inputs.backfill && ((github.event_name == 'schedule' && steps.day.outputs.is_digest_day == 'true') || inputs.digest || inputs.send_email)) && '--digest' || '' }} \
              ${{ (!inputs.backfill && ((github.event_name == 'schedule' && steps.day.outputs.is_digest_day == 'true') || inputs.send_email)) && '--email' || '' }}
          fi

      # Commit even if the email step inside the script failed — the seen-db
      # and pending table must advance or the next run double-reports.
      - name: Commit state to the private repo
        if: always()
        run: |
          cd "$RUNNER_TEMP/premium"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A on the directory: collect-only and backfill runs update seen.db
          # but write no digest, and a missing literal pathspec is fatal.
          git add -A mention_monitor_state
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Mention monitor: update state and digest"
            git pull --rebase origin main
            git push
          fi
