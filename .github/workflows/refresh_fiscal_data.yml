name: Refresh NYC Council Fiscal Impacts

# FALLBACK (Tal, Sep 28 2026): a Claude Code cloud routine (Max plan, no API
# key) is now the primary path — it runs on the 1st at 12:17 UTC, fetches new
# documents with these same scripts (no model calls), extracts them itself
# via --emit-packets/--ingest, and commits pipeline/max_refresh.json marking
# which ids are done for the month. This workflow runs later so the routine
# has a head start; MAX_REFRESH_GATE=1 on the extraction step makes it read
# that marker and skip every id already done (normally all of them, so zero
# API calls this billing cycle). If the routine didn't run or didn't finish
# an id, this is what extracts it, still calling the Anthropic API (Sonnet),
# billed per token outside Claude Max (legislation-trackers skill, "Billing").
on:
  schedule:
    # 1st of each month, 18:23 UTC — after the Max routine's 12:17 UTC run
    # (6h head start). The old 7:00/11:23 UTC slots hit legistar.council.nyc.gov's
    # unresponsive early-morning window and the search request timed out on
    # both Jul and Aug 2026 scheduled runs; this run must still finish 3h+
    # before the implementation refresh (21:40 UTC per orders_routine.md) so alerts, the Ask index
    # and member/agency profiles read that same month's fiscal data.
    - cron: "23 18 1 * *"
    # Cheap resume-only check, days 2-7 of the month: a batch submitted on the
    # 1st is usually done within an hour but can take up to 24; this exits
    # immediately (no API call at all) when no batch is pending, and only
    # polls/finishes one when fiscal_batch_state.json exists.
    - cron: "0 12 2-7 * *"
  workflow_dispatch:
    inputs:
      sync:
        description: "Force synchronous (non-batch) extraction instead of the scheduled run's batch mode"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      incremental:
        description: "Skip already-processed matters"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      seed_laws:
        description: "Also check enacted laws from laws.json: 'auto' (prev + current year), '2024-2026', 'all', or blank"
        required: false
        default: "auto"
        type: string
      reextract:
        description: "Re-extract records already in the table and replace them: 'superseded' (newer statement on the page) or 'all'. Blank = normal run"
        required: false
        default: ""
        type: choice
        options: ["", "superseded", "all"]
      matters:
        description: "Comma-separated matter ids. With reextract: limit it to these records. Without: process exactly these laws (skip list ignored)"
        required: false
        default: ""
        type: string
      rest_years:
        description: "Legistar REST enumeration (needs LEGISTAR_TOKEN secret): year range like 2014-2023, or blank to skip"
        required: false
        default: ""
        type: string

# one fiscal run at a time: two overlapping runs both rewrite fiscal_impacts.json
# and the second push conflicts (Sep 24 2026, recovered from the artifact)
concurrency:
  group: fiscal-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Batch mode (half price) waits up to 5h (MAX_WAIT_S in fetch_fiscal_impacts.py)
    # before leaving state for the next run; the rest of the job (checkout,
    # install, validator, commit/push) needs some more room, so the job
    # timeout is raised to the 360-minute account cap rather than left at it
    # implicitly.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        # antiword reads the legacy .doc statements (Oct 6 2026); pypdf the PDFs
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q antiword
          pip install -r pipeline/requirements.txt

      # Resume-only path (the cheap daily cron, days 2-7): exits immediately
      # if no batch is pending, otherwise polls/finishes it. Never runs on
      # the monthly cron or a manual dispatch.
      - name: Resume a pending batch (daily check)
        if: ${{ github.event.schedule == '0 12 2-7 * *' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BATCH: "1"   # must match the mode the batch was submitted under
          MAX_REFRESH_GATE: "1"
        run: python pipeline/fetch_fiscal_impacts.py --resume-only

      # BILLING: batch mode (CLAUDE_BATCH=1) is half price on every token and
      # reuses one submitted Message Batch across the run; prompt caching
      # (claude_batch.cached_content, always on) reads the fixed instructions
      # at ~0.1x price on every call after the first. On for the scheduled
      # monthly run; `sync: true` on a manual dispatch turns batch off.
      # MAX_REFRESH_GATE=1: skip every id the Max-plan routine already
      # extracted this month (pipeline/max_refresh.json) — normally all of
      # them, so this step makes zero API calls.
      - name: Run fiscal impacts pipeline
        if: ${{ github.event.schedule != '0 12 2-7 * *' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BATCH: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.sync == 'true') && '0' || '1' }}
          MAX_REFRESH_GATE: "1"
        run: |
          INCREMENTAL="${{ github.event.inputs.incremental || 'true' }}"
          # Legistar's attachment search surfaces only ~300 matters, so every
          # run also walks the enacted-law list (laws.json) for the previous
          # and current year. Pass a range like 2024-2026 or 'all' to backfill.
          SEED="${{ github.event.inputs.seed_laws || 'auto' }}"
          REEXTRACT="${{ github.event.inputs.reextract }}"
          FLAGS=""
          if [ -n "$REEXTRACT" ]; then
            FLAGS="--reextract $REEXTRACT"
            MATTERS="${{ github.event.inputs.matters }}"
            if [ -n "$MATTERS" ]; then FLAGS="$FLAGS --matters $MATTERS"; fi
          elif [ -n "${{ github.event.inputs.matters }}" ]; then
            # re-check named matters from laws.json (skip list ignored)
            FLAGS="--matters ${{ github.event.inputs.matters }}"
          else
            if [ "$INCREMENTAL" = "true" ]; then FLAGS="--incremental"; fi
            if [ -n "$SEED" ]; then FLAGS="$FLAGS --seed-laws $SEED"; fi
          fi
          echo "Running (CLAUDE_BATCH=$CLAUDE_BATCH): python pipeline/fetch_fiscal_impacts.py $FLAGS"
          python pipeline/fetch_fiscal_impacts.py $FLAGS

      - name: Legistar REST enumeration (optional, workflow_dispatch only)
        if: ${{ github.event.inputs.rest_years != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEGISTAR_TOKEN: ${{ secrets.LEGISTAR_TOKEN }}
        run: |
          # Enumerates EVERY matter in the range through the REST API (pending
          # bills, resolutions and SLRs included, not just enacted laws), checks
          # each for a fiscal attachment, extracts, merges. Phase 1 is seconds;
          # phase 2 is ~0.6 s per matter plus Claude for the non-zero ones, so
          # run a few years at a time. Then resolve web ids/links for anything
          # laws.json did not know.
          if [ -z "$LEGISTAR_TOKEN" ]; then
            echo "::error::LEGISTAR_TOKEN secret is empty. Set it with: gh secret set LEGISTAR_TOKEN --repo TalR24/nycur-data-website (paste the token at the prompt). Refusing to fall back to web scraping, which cannot reach historical years."
            exit 1
          fi
          python pipeline/fetch_fiscal_impacts_historical.py --years "${{ github.event.inputs.rest_years }}" --phase 1
          python pipeline/fetch_fiscal_impacts_historical.py --years "${{ github.event.inputs.rest_years }}" --phase 2
          python pipeline/backfill_legistar_file.py

      - name: Regenerate agency chart data
        run: python pipeline/regenerate_agency_data.py

      # fiscal audit (Oct 6 2026): the validator ran without --strict under
      # continue-on-error, so a hard failure could never stop a commit, and
      # the 25 rule tests ran nowhere. Both now block the push; the data
      # still survives as the fiscal-data artifact below (if: always()).
      - name: Fiscal rule tests
        run: python pipeline/tests/test_fiscal_rules.py

      - name: Data validator (a hard failure blocks the commit)
        run: python pipeline/validate_fiscal_impacts.py --strict

      - name: Pre-render static snapshots (overview + hub, readable without JS)
        run: |
          python pipeline/build_fiscal_static_snapshots.py
          # the umbrella hub's fiscal stat pills read fiscal_impacts.json too
          python civic_reference/legislation_implementation_tracker/pipeline/build_static_snapshots.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civic_reference/nyc_council_fiscal_impacts_tracker/data/fiscal_impacts.json \
                  civic_reference/nyc_council_fiscal_impacts_tracker/agency-fiscal-impact/data.json \
                  civic_reference/nyc_council_fiscal_impacts_tracker/overview/index.html \
                  civic_reference/nyc_council_fiscal_impacts_tracker/index.html \
                  civic_reference/nyc_council_legislation_trackers/index.html \
                  pipeline/no_impact_matters.json
          # fiscal_batch_state.json / fiscal_batch_pending.json: a batch still
          # pending leaves them present (stage the addition/update); a batch
          # that finished and saved this run deletes both (stage the deletion
          # too, or a committed state file with no matching batch makes the
          # next run resume a batch that no longer exists, forever). `git add`
          # alone never stages a deletion, so check either a tracked path
          # (deleted from disk: stage removal) or a path that now exists
          # (new/updated: stage it) and use `-A` either way.
          for f in pipeline/fiscal_batch_state.json pipeline/fiscal_batch_pending.json pipeline/max_refresh.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1 || [ -f "$f" ]; then
              git add -A -- "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(python3 -c "import json; d=json.load(open('civic_reference/nyc_council_fiscal_impacts_tracker/data/fiscal_impacts.json')); print(d['metadata']['total_records'])")
            git commit -m "data: refresh fiscal impacts — $COUNT records [$(date -u '+%Y-%m-%d')]"
            # The pipeline runs 30 min to several hours; other pushes can land
            # on main in that window and reject a plain push (Aug 20 2026), and
            # GitHub itself can reject with "remote: fatal error in commit_refs"
            # (Sep 2 2026, which threw away a 2 h 16 min seed run). Rebase our
            # single data commit on top of whatever arrived and retry the push
            # with backoff before giving up.
            for attempt in 1 2 3 4 5 6; do
              git -c rebase.autoStash=true pull --rebase origin main
              if git push; then echo "pushed on attempt $attempt"; break; fi
              if [ "$attempt" = 6 ]; then echo "push failed 6 times"; exit 1; fi
              sleep $((attempt * 45))
            done
          fi

      # Even if the push above fails, the run's output survives as an artifact
      # (30 days). Recover with: gh run download <run id> -n fiscal-data, then
      # copy the three files into place, re-run regenerate_agency_data.py,
      # commit, push.
      - name: Upload data files as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-data
          path: |
            civic_reference/nyc_council_fiscal_impacts_tracker/data/fiscal_impacts.json
            civic_reference/nyc_council_fiscal_impacts_tracker/agency-fiscal-impact/data.json
            pipeline/no_impact_matters.json
          retention-days: 30
