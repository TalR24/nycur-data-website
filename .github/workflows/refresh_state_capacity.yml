name: Refresh State Capacity Data

on:
  schedule:
    # 6 AM EST (11:00 UTC) / 7 AM EDT (11:00 UTC) — UTC doesn't shift with DST
    - cron: "0 11 * * *"
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # full history needed for git log timestamp comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install numpy

      - name: Check for CSV changes
        id: check
        working-directory: state_capacity_ecosystem
        run: |
          DIR_CSV_TIME=$(git log -1 --format="%ct" -- data/directory.csv)
          AFF_JSON_TIME=$(git log -1 --format="%ct" -- data/affinity.json)
          CON_CSV_TIME=$(git log -1 --format="%ct" -- data/connect_submissions.csv)
          CON_JSON_TIME=$(git log -1 --format="%ct" -- data/connect.json)

          echo "directory.csv: $DIR_CSV_TIME  |  affinity.json: $AFF_JSON_TIME"
          echo "connect_submissions.csv: $CON_CSV_TIME  |  connect.json: $CON_JSON_TIME"

          if [ -z "$DIR_CSV_TIME" ] || [ -z "$AFF_JSON_TIME" ] || [ "$DIR_CSV_TIME" -gt "$AFF_JSON_TIME" ]; then
            echo "org_changed=true" >> "$GITHUB_OUTPUT"
            echo "directory.csv changed — rebuilding org JSON + stat strings."
          else
            echo "org_changed=false" >> "$GITHUB_OUTPUT"
            echo "directory.csv unchanged — skipping org rebuild."
          fi

          if [ -z "$CON_CSV_TIME" ] || [ -z "$CON_JSON_TIME" ] || [ "$CON_CSV_TIME" -gt "$CON_JSON_TIME" ]; then
            echo "connect_changed=true" >> "$GITHUB_OUTPUT"
            echo "connect_submissions.csv changed — rebuilding connect.json."
          else
            echo "connect_changed=false" >> "$GITHUB_OUTPUT"
            echo "connect_submissions.csv unchanged — skipping connect rebuild."
          fi

      # ── Org data pipeline (directory.csv → affinity/directory/search JSON + stat strings) ──

      - name: Rebuild org JSON files
        if: steps.check.outputs.org_changed == 'true'
        working-directory: state_capacity_ecosystem
        run: python3 data/build_affinity.py

      - name: Update hardcoded stat strings
        if: steps.check.outputs.org_changed == 'true'
        working-directory: state_capacity_ecosystem
        run: python3 data/update_stats.py

      # ── Connect pipeline (connect_submissions.csv → connect.json + email notifications) ──

      - name: Snapshot previous Connect entries (before rebuild)
        if: steps.check.outputs.connect_changed == 'true'
        run: |
          git show HEAD:state_capacity_ecosystem/data/connect.json \
            > /tmp/connect_prev.json 2>/dev/null || echo "[]" > /tmp/connect_prev.json

      - name: Rebuild Connect JSON
        if: steps.check.outputs.connect_changed == 'true'
        working-directory: state_capacity_ecosystem
        run: python3 data/build_people.py

      # ── Commit and push whatever changed ──

      - name: Commit and push
        if: steps.check.outputs.org_changed == 'true' || steps.check.outputs.connect_changed == 'true'
        env:
          ORG_CHANGED: ${{ steps.check.outputs.org_changed }}
          CON_CHANGED: ${{ steps.check.outputs.connect_changed }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BASE="state_capacity_ecosystem"

          if [ "$ORG_CHANGED" = "true" ]; then
            git add \
              "$BASE/data/affinity.json" \
              "$BASE/data/directory.json" \
              "$BASE/data/affinity_search.json" \
              "$BASE/databases/methodology/index.html" \
              "$BASE/README.md" \
              index.html \
              README.md
          fi

          if [ "$CON_CHANGED" = "true" ]; then
            git add "$BASE/data/connect.json"
          fi

          if git diff --staged --quiet; then
            echo "Nothing staged — skipping commit."
            exit 0
          fi

          ORG_STAT=""
          CON_STAT=""
          if [ "$ORG_CHANGED" = "true" ]; then
            ORG=$(python3 -c "import json; s=json.load(open('$BASE/data/affinity.json'))['stats']; print(s['org_count'])")
            EDGES=$(python3 -c "import json; s=json.load(open('$BASE/data/affinity.json'))['stats']; print(s['edge_count'])")
            ORG_STAT="${ORG} orgs, ${EDGES} edges"
          fi
          if [ "$CON_CHANGED" = "true" ]; then
            CON=$(python3 -c "import json; print(len(json.load(open('$BASE/data/connect.json'))))")
            CON_STAT="${CON} Connect entries"
          fi

          if [ -n "$ORG_STAT" ] && [ -n "$CON_STAT" ]; then
            SUMMARY="${ORG_STAT}, ${CON_STAT}"
          elif [ -n "$ORG_STAT" ]; then
            SUMMARY="$ORG_STAT"
          else
            SUMMARY="$CON_STAT"
          fi

          git commit -m "Data: auto-refresh — ${SUMMARY} [$(date -u '+%Y-%m-%d')]"
          git push

      # ── Email notifications last: a Gmail failure must never block the data commit ──

      - name: Email new Connect entries
        if: steps.check.outputs.connect_changed == 'true'
        working-directory: state_capacity_ecosystem
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 data/notify_new_connect.py \
            /tmp/connect_prev.json \
            data/connect.json
