name: Sunday brief fallback

# Digests are built on Saturday (GitHub cron starts 3 to 9 h late). The Sunday cloud routine writes planning/briefs/YYYY-MM-DD.md into the private
# premium repo and sends the ONE Sunday week-ahead email. This workflow runs
# after it is due. If today's brief file is missing, contains "EMAIL NOT SENT", or
# no Saturday Gmail sweep report exists for the last 8 days, it emails the raw
# mention and opportunity digests so nothing is lost; otherwise it exits
# silently (logic: seo/sunday_fallback.py). Delivery: SMTP via seo/common.send_email. Billing: no Anthropic API.
# Secrets: GMAIL_USER, GMAIL_APP_PASSWORD, PREMIUM_PUSH_TOKEN.

on:
  schedule:
    - cron: "30 16 * * 0"   # Sunday 16:30 UTC, after the 13:00 UTC Sunday week-ahead routine (trig_01F1EJTV9kbR5MJiJQEKKoPw)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone the premium repo
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" "$RUNNER_TEMP/premium"

      - name: Email the raw digests if the Sunday brief did not arrive
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENT_ARCHIVE_DIR: ${{ runner.temp }}/premium/planning/sent   # exact body of the sent email (seo/common.archive_sent)
        run: python3 seo/sunday_fallback.py --premium "${{ runner.temp }}/premium"

      - name: File the sent fallback in the premium repo
        run: |
          cd "${{ runner.temp }}/premium"
          if [ -d planning/sent ]; then git add planning/sent; fi
          if git diff --cached --quiet; then
            echo "No fallback was sent; nothing to file."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Sunday fallback email archive"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              sleep $((i * 15))
            done
          fi
