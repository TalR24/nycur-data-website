name: Monthly SEO report

# Pulls the last 28 days from Google Search Console for nycuriosity.com (a
# domain property: covers the Substack site, data.nycuriosity.com and
# talroded.nycuriosity.com; State Capacity Ecosystem has its own routine), emails the report
# to Tal, and files the Markdown + JSON snapshot in the PRIVATE premium repo
# (seo_reports/) so in-session reviews have history. Traffic numbers never
# land in this public repo. This is the one monthly NYCuriosity SEO email (the
# drafting memo routine was retired Oct 3 2026).
# The email opens with a to-do list (seo/report_email.py): each action has
# steps and a Claude Code prompt to paste.
#
# Delivery (Oct 17 2026): DIGEST_DELIVERY=file means this report no longer
# emails. It writes ops_digest/pending/seo.{html,txt,json} into the premium
# repo, and monthly_ops_digest.yml folds it into ONE monthly ops email on the
# 5th. If that write or push fails, the report is emailed as before. Set
# DIGEST_DELIVERY=email below to restore the direct email.
# Billing: no Anthropic API.
#
# Secrets: GSC_SERVICE_ACCOUNT_JSON (service account key added as a user on
# both Search Console properties), GMAIL_USER, GMAIL_APP_PASSWORD,
# PREMIUM_PUSH_TOKEN (all but the first already exist for other workflows).

on:
  schedule:
    - cron: "0 12 2 * *"   # 2nd of each month, 12:00 UTC (8am ET)
  workflow_dispatch:
    inputs:
      days:
        description: "Days to report on"
        default: "28"

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DIGEST_DELIVERY: file   # file | email
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the report dates each unseen page by its first commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Clone the premium repo (change log in, snapshot out)
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" /tmp/premium

      - name: Pull Search Console data and email the report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 seo/gsc_pull.py --days "${{ inputs.days || '28' }}" --out /tmp/seo_reports \
            --changes /tmp/premium/seo_reports/changes.md --email \
            --ops-pending /tmp/premium/ops_digest/pending

      - name: File the snapshot and the ops digest section in the premium repo
        id: filing
        run: |
          mkdir -p /tmp/premium/seo_reports
          cp /tmp/seo_reports/*.md /tmp/seo_reports/*.json /tmp/seo_reports/*.html /tmp/premium/seo_reports/
          cd /tmp/premium
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seo_reports
          if [ -d ops_digest/pending ]; then git add ops_digest/pending; fi
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "Monthly SEO report snapshot"
            if ! git pull --rebase origin main || ! git push; then
              echo "push_ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Could not push to the premium repo; the next step emails the report."
            fi
          fi

      # Never lose a report: if the section could not reach the premium repo,
      # email it directly.
      - name: Email the report if the premium push failed
        if: ${{ always() && env.DIGEST_DELIVERY == 'file' && (steps.filing.outcome == 'failure' || steps.filing.outputs.push_ok == 'false') }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          test -f /tmp/premium/ops_digest/pending/seo.txt || { echo "No seo section was written; nothing to email."; exit 0; }
          python3 ops_digest/assemble.py --send-files --subject "NYCuriosity SEO report (monthly ops digest push failed)" \
            --txt /tmp/premium/ops_digest/pending/seo.txt --html /tmp/premium/ops_digest/pending/seo.html
