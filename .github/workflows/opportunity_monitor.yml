name: Opportunity Monitor

# Delivery (Oct 17 2026): DIGEST_DELIVERY=file means the radar no longer emails
# its own digest. It writes opportunities/state/digests/YYYY-MM-DD.{html,txt,json}
# into the premium repo, and the Sunday cloud routine folds it into ONE Sunday
# week-ahead email (the Friday discovery routine still runs first). If the write
# or the push fails, the digest is emailed directly, and sunday_brief_fallback.yml
# emails the raw digests if the routine's brief never lands. Set
# DIGEST_DELIVERY=email below to restore the direct email. The "run failed"
# alert is unchanged.
# Billing: no Anthropic API.

on:
  schedule:
    - cron: "0 11 * * 0"   # Sunday 11:00 UTC = 7:00 EDT / 6:00 EST (before the 13:00 UTC Sunday brief routine)
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the digest when it runs"
        type: boolean
        default: false
      no_fetch:
        description: "Skip the page re-check (state and digest only)"
        type: boolean
        default: false

permissions:
  contents: read   # state commits go to the private repo via PREMIUM_PUSH_TOKEN

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      DIGEST_DELIVERY: ${{ github.event_name == 'schedule' && 'file' || 'email' }}   # scheduled runs feed the Sunday brief; manual dispatch emails directly
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r opportunity_monitor/requirements.txt

      - name: Run offline tests
        run: python3 -m unittest discover -s opportunity_monitor -p "test_monitor.py" -v

      # State (pages.json, digests, last_run.json) lives in the private
      # premium repo alongside the watch list it reads: the list is Tal's
      # private opportunities pipeline and must not be public.
      - name: Check out private state
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: |
          git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" "$RUNNER_TEMP/premium"
          mkdir -p "$RUNNER_TEMP/premium/opportunities/state/digests"

      - name: Run opportunity monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MENTION_DIGEST_TO: ${{ secrets.MENTION_DIGEST_TO }}
          OPPS_DIGEST_TO: ${{ secrets.OPPS_DIGEST_TO }}
          OPPS_TRACKER_URL: ${{ secrets.OPPS_TRACKER_URL }}
        # A scheduled run always writes a digest, even when quiet, so a missing
        # opportunity section in the Sunday brief means failure, not "nothing to report".
        run: |
          python3 opportunity_monitor/monitor.py \
            --watchlist "$RUNNER_TEMP/premium/opportunities/watchlist.yaml" \
            --state-dir "$RUNNER_TEMP/premium/opportunities/state" \
            ${{ (github.event_name == 'schedule' || inputs.send_email) && '--email' || '' }} \
            ${{ inputs.no_fetch && '--no-fetch' || '' }}

      - name: Email on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPPS_DIGEST_TO: ${{ secrets.OPPS_DIGEST_TO }}
          MENTION_DIGEST_TO: ${{ secrets.MENTION_DIGEST_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, smtplib
          from email.mime.text import MIMEText
          user, pw = os.environ.get("GMAIL_USER"), os.environ.get("GMAIL_APP_PASSWORD")
          if user and pw:
              msg = MIMEText("The opportunities radar run failed. Nothing was checked or "
                             "emailed today.\n\n" + os.environ["RUN_URL"] + "\n")
              msg["Subject"] = "Opportunities radar run failed"
              msg["From"] = user
              msg["To"] = os.environ.get("OPPS_DIGEST_TO") or os.environ.get("MENTION_DIGEST_TO") or user
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as s:
                  s.login(user, pw); s.send_message(msg)
              print("Failure email sent.")
          EOF

      - name: Commit state to the private repo
        id: commit
        if: always()
        run: |
          cd "$RUNNER_TEMP/premium"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A opportunities/state
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Opportunities radar: update state and digest"
            if ! git pull --rebase origin main || ! git push; then
              echo "push_ok=false" >> "$GITHUB_OUTPUT"
              echo "::error::Could not push to the premium repo; the next step emails the digest."
              exit 1
            fi
          fi

      # Never lose a digest: in file mode a failed push leaves it only on this
      # runner, so email it directly.
      - name: Email the digest if the premium push failed
        if: ${{ always() && steps.commit.outputs.push_ok == 'false' && env.DIGEST_DELIVERY == 'file' && (github.event_name == 'schedule' || inputs.send_email) }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          D="$RUNNER_TEMP/premium/opportunities/state/digests/$(date -u +%Y-%m-%d)"
          test -f "$D.txt" || { echo "No digest was written; nothing to email."; exit 0; }
          python3 ops_digest/assemble.py --send-files --subject "Opportunities radar (premium push failed)" --txt "$D.txt" --html "$D.html"
