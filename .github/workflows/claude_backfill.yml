name: Claude backfill (one-off tasks)

# Manual-only jobs that call the Anthropic API outside the monthly refreshes.
# BILLING: every task here is billed per token on the API account (canary: cents),
# not covered by Claude Max. Judgment work (verify_*, audits) runs on Max as
# subagents via the scripts' --emit-packets/--ingest modes; dispatch these only
# with Tal's approval of the call count and cost (global CLAUDE.md, "Billing").
# No member alerts are sent from here.
#   canary                 one call per structured-output schema; run first
#   label_kinds            model duty/power/neither label for every obligation record
#   reextract_obligations  re-extract the laws in reextract_queue.json, rebuild data
#   pilot_obligations      try another model on a few laws; artifact only, never committed
#   verify_fiscal          blind-check every fiscal record against its statement (Opus); commits the report
#   verify_obligations     after re-extracting the protected laws: diff them against the hand-fixed
#                          snapshot and have Opus judge each disagreement; commits the decisions
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        type: choice
        options: ["canary", "label_kinds", "reextract_obligations", "pilot_obligations", "verify_fiscal", "verify_obligations"]
      batch:
        description: "reextract_obligations: submit one Message Batch (half price) instead of synchronous calls"
        required: false
        default: true
        type: boolean
      no_sync_fallback:
        description: "reextract_obligations batch: collect the batch only, no synchronous retries (laws needing one stay queued)"
        required: false
        default: false
        type: boolean
      include_protected:
        description: "reextract_obligations: also re-extract laws in reextract_exclusions.json"
        required: false
        default: false
        type: boolean
      matters:
        description: "pilot_obligations / verify_fiscal: matter ids, space- or comma-separated"
        required: false
        default: ""
        type: string
      model:
        description: "pilot_obligations: model id"
        required: false
        default: "claude-sonnet-5"
        type: string

# shares a group with the monthly refresh so the two never commit over each other
concurrency:
  group: obligations-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q antiword   # legacy .doc fiscal statements
          pip install -r pipeline/requirements.txt
          pip install -r civic_reference/legislation_implementation_tracker/pipeline/requirements.txt

      - name: Canary
        if: ${{ inputs.task == 'canary' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/api_canary.py

      - name: Label duty / power / neither
        if: ${{ inputs.task == 'label_kinds' }}
        working-directory: civic_reference/legislation_implementation_tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LABEL_WORKERS: "6"
        run: python3 pipeline/label_kinds.py

      - name: Re-extract queued laws and rebuild
        if: ${{ inputs.task == 'reextract_obligations' }}
        working-directory: civic_reference/legislation_implementation_tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REEXTRACT_LIMIT: "250"   # sync: ~60 min at 4 workers; batch: one submission
          PYTHONUNBUFFERED: "1"   # progress lines reach the log as they happen
          REEXTRACT_WORKERS: "4"
          REEXTRACT_INCLUDE_PROTECTED: ${{ inputs.include_protected && '1' || '' }}
          # BILLING: batch mode is half price; waits up to 120 min, then leaves
          # batch_state_reextract.json committed for the monthly resume job
          CLAUDE_BATCH: ${{ inputs.batch && '1' || '' }}
          BATCH_NO_SYNC_FALLBACK: ${{ inputs.no_sync_fallback && '1' || '' }}
        run: |
          python3 pipeline/reextract_queued.py
          python3 pipeline/extract_obligations.py --incremental
          cd ../nyc_council_legislation_trackers
          # all profile files (Sep 30 2026); a failure is named in the log
          # and turns the run red after the commit, never blocks it
          bash pipeline/rebuild_profiles.sh || echo "PROFILES_FAILED=1" >> "$GITHUB_ENV"

      - name: Verify every fiscal record against its statement
        if: ${{ inputs.task == 'verify_fiscal' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MATTERS: ${{ inputs.matters }}
        run: |
          if [ -n "$MATTERS" ]; then python3 pipeline/verify_fiscal.py --matters $(echo "$MATTERS" | tr ',' ' ')
          else python3 pipeline/verify_fiscal.py; fi

      - name: Reconcile re-extracted protected laws
        if: ${{ inputs.task == 'verify_obligations' }}
        working-directory: civic_reference/legislation_implementation_tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 pipeline/reconcile_protected.py diff
          python3 pipeline/verify_obligations.py

      - name: Upload verification output
        if: ${{ always() && (inputs.task == 'verify_fiscal' || inputs.task == 'verify_obligations') }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: |
            civic_reference/nyc_council_legislation_trackers/quality/fiscal_verification_*.json
            civic_reference/legislation_implementation_tracker/pipeline/reconcile_protected.json
            civic_reference/legislation_implementation_tracker/pipeline/reconcile_decisions.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Pilot another model on a few laws (no commit)
        if: ${{ inputs.task == 'pilot_obligations' }}
        working-directory: civic_reference/legislation_implementation_tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 pipeline/pilot_extract.py --model "${{ inputs.model }}" --matters ${{ inputs.matters }}
          python3 pipeline/extract_obligations.py --incremental
          mkdir -p /tmp/pilot && cp data/obligations.json data/powers.json /tmp/pilot/
          cp pipeline/cache/extracted/*.json /tmp/pilot/ 2>/dev/null || true

      - name: Upload pilot output
        if: ${{ inputs.task == 'pilot_obligations' }}
        uses: actions/upload-artifact@v4
        with:
          name: pilot-obligations
          path: /tmp/pilot/
          retention-days: 30

      # a failed push must never lose a batch again (Sep 26 2026): the rebuilt
      # data and the per-law extractions survive 30 days as an artifact
      - name: Upload re-extraction output
        if: ${{ always() && inputs.task == 'reextract_obligations' }}
        uses: actions/upload-artifact@v4
        with:
          name: reextract-output
          path: |
            civic_reference/legislation_implementation_tracker/data/obligations.json
            civic_reference/legislation_implementation_tracker/data/powers.json
            civic_reference/legislation_implementation_tracker/data/laws.json
            civic_reference/legislation_implementation_tracker/data/restated_links.json
            civic_reference/legislation_implementation_tracker/data/summary.json
            civic_reference/legislation_implementation_tracker/pipeline/reextract_queue.json
            civic_reference/legislation_implementation_tracker/pipeline/cache/extracted/
            civic_reference/nyc_council_legislation_trackers/data/members.json
            civic_reference/nyc_council_legislation_trackers/data/agencies.json
            civic_reference/nyc_council_legislation_trackers/data/member_votes.json
            civic_reference/nyc_council_legislation_trackers/data/member_context.json
            civic_reference/nyc_council_legislation_trackers/data/council_members.json
          retention-days: 30

      - name: Commit results
        if: ${{ always() && inputs.task != 'canary' && inputs.task != 'pilot_obligations' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          L=civic_reference/legislation_implementation_tracker
          for f in $L/pipeline/kind_labels.json $L/data/obligations.json $L/data/powers.json \
                   $L/data/laws.json $L/data/restated_links.json $L/data/summary.json $L/pipeline/reextract_queue.json \
                   civic_reference/nyc_council_legislation_trackers/data/members.json \
                   civic_reference/nyc_council_legislation_trackers/data/agencies.json \
                   civic_reference/nyc_council_legislation_trackers/data/member_votes.json \
                   civic_reference/nyc_council_legislation_trackers/data/member_context.json \
                   civic_reference/nyc_council_legislation_trackers/data/council_members.json \
                   $L/pipeline/reconcile_protected.json $L/pipeline/reconcile_decisions.json \
                   civic_reference/nyc_council_legislation_trackers/quality/fiscal_verification_*.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # batch state: stage additions AND deletions (a finished batch clears it)
          f=$L/pipeline/batch_state_reextract.json
          if git ls-files --error-unmatch "$f" >/dev/null 2>&1 || [ -f "$f" ]; then git add -A -- "$f"; fi
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Claude backfill: ${{ inputs.task }} [$(date -u '+%Y-%m-%d')]"
          # autostash: any file the rebuild changed but this step does not
          # stage blocked every rebase on Sep 26 2026 and the loop still
          # exited green, losing a 250-law batch. Now it fails loudly.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push; then pushed=1; break; fi
            sleep $((attempt * 30))
          done
          if [ "$pushed" != 1 ]; then echo "::error::push failed after 5 attempts"; exit 1; fi

      - name: Fail the run if a profile rebuild failed
        if: ${{ always() && env.PROFILES_FAILED == '1' }}
        run: |
          echo "::error::A profile rebuild step failed (see the re-extraction log). Tracker data was committed."
          exit 1
