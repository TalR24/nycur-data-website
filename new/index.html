<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New — NYCuriosity Data</title>
  <meta name="description" content="Every new tool, chart hub, and site change on NYCuriosity Data, newest first.">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://data.nycuriosity.com/new/">
  <meta property="og:title"       content="What's New — NYCuriosity Data">
  <meta property="og:description" content="Every new tool, chart hub, and site change on NYCuriosity Data, newest first.">
  <meta property="og:image"       content="https://data.nycuriosity.com/website_logo.png">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:image"      content="https://data.nycuriosity.com/website_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="/assets/site.js?v=20260804"></script>
  <link rel="stylesheet" href="/assets/brand.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #C84609;
      --blue-hover: #A44D00;
      --blue-light: #FAF6F1;
      --blue-mid:   #EDC3A5;
      --orange:     #A44D00;
      --text:       #1A1208;
      --text-mid:   #4A3B2C;
      --text-muted: #6B5B4A;
      --text-faint: #9A8B7A;
      --bg:         #FAF6F1;
      --surface:    #ffffff;
      --border:     #E7DDCE;
      --shadow-sm:  0 1px 3px rgba(26,18,8,0.08);
      --radius:     10px;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #170C03;
      border-bottom: 1px solid #2E1C0C;
      padding: 0 clamp(20px, 5vw, 48px);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-link {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: #FFD23F;
      text-decoration: none;
    }
    .back-link:hover { color: #fff; }
    .header-divider { width: 1px; height: 22px; background: #4A3B2C; }
    .header-title {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: #E7DDCE;
    }

    .hero { padding: clamp(32px, 6vw, 56px) clamp(20px, 5vw, 48px) 8px; }
    .hero-inner { max-width: 900px; margin: 0 auto; }
    .breadcrumb {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-bottom: 18px;
    }
    .breadcrumb a { color: var(--text-faint); text-decoration: none; }
    .breadcrumb a:hover { color: var(--blue); }
    .breadcrumb .current { color: var(--orange); font-weight: 600; }
    .hero h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.012em;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .hero h1 span { color: var(--blue); }
    .hero p { font-size: 0.98rem; color: var(--text-muted); max-width: 640px; line-height: 1.6; }

    main { flex: 1; padding: clamp(24px, 4vw, 40px) clamp(20px, 5vw, 48px) clamp(48px, 6vw, 72px); }
    .main-inner { max-width: 900px; margin: 0 auto; }

    .update-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .update-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .update-item:hover { border-color: var(--blue); }
    .update-item a {
      display: flex;
      align-items: baseline;
      gap: 18px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      flex-wrap: wrap;
    }
    .update-date {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--orange);
      white-space: nowrap;
      min-width: 92px;
    }
    .update-title {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.5;
      flex: 1;
      min-width: 220px;
    }
    .update-item a:hover .update-title { color: var(--blue); }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 20px clamp(20px, 5vw, 48px);
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-copy { font-size: 0.8rem; color: var(--text-faint); }
    .footer-links { display: flex; align-items: center; gap: 20px; }
    .footer-links a { font-size: 0.8rem; color: var(--text-muted); text-decoration: none; transition: color 0.15s; }
    .footer-links a:hover { color: var(--blue); }
  
    /* ── TOPIC COLOUR (2026 rebrand) ──────────────────────
       Colour encodes what KIND of thing something is. The bright fills are
       decorative only; the -ink twins are the only variants safe for text
       (each is tuned to 4.5:1 on Canvas Cream). Tokens: assets/brand.css */
    .card[data-topics~="transit"] .card-category { color: var(--b-topic-transit-ink); }
    .card[data-topics~="cb"]      .card-category { color: var(--b-topic-cb-ink); }
    .card[data-topics~="budget"]  .card-category { color: var(--b-topic-budget-ink); }
    .card[data-topics~="govtech"] .card-category { color: var(--b-topic-govtech-ink); }
    .tf-pill[data-topic="transit"]:hover  { border-color: var(--b-topic-transit-ink); color: var(--b-topic-transit-ink); }
    .tf-pill[data-topic="cb"]:hover       { border-color: var(--b-topic-cb-ink); color: var(--b-topic-cb-ink); }
    .tf-pill[data-topic="budget"]:hover   { border-color: var(--b-topic-budget-ink); color: var(--b-topic-budget-ink); }
    .tf-pill[data-topic="govtech"]:hover  { border-color: var(--b-topic-govtech-ink); color: var(--b-topic-govtech-ink); }
    .tf-pill[data-topic="transit"].active { background: var(--b-topic-transit-ink); border-color: var(--b-topic-transit-ink); color: #fff; }
    .tf-pill[data-topic="cb"].active      { background: var(--b-topic-cb-ink); border-color: var(--b-topic-cb-ink); color: #fff; }
    .tf-pill[data-topic="budget"].active  { background: var(--b-topic-budget-ink); border-color: var(--b-topic-budget-ink); color: #fff; }
    .tf-pill[data-topic="govtech"].active { background: var(--b-topic-govtech-ink); border-color: var(--b-topic-govtech-ink); color: #fff; }
    /* A row of figures should not read as one colour. */
    .stat-pill:nth-child(4n+1) .sp-num { color: var(--b-topic-budget-ink); }
    .stat-pill:nth-child(4n+2) .sp-num { color: var(--b-topic-transit-ink); }
    .stat-pill:nth-child(4n+3) .sp-num { color: var(--b-topic-cb-ink); }
    .stat-pill:nth-child(4n+4) .sp-num { color: var(--b-brown); }
  
    /* Header action buttons on subpages (Tal, Sep 2026 — previously hub-only). */
    .header-actions { display:flex; align-items:center; gap:12px; margin-left:auto; flex-shrink:0; }
    .header-link { font-size:0.8rem; font-weight:500; color:#9A8B7A; text-decoration:none; display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border:1px solid rgba(255,255,255,0.15); border-radius:6px; transition:color .15s,border-color .15s,background .15s; white-space:nowrap; }
    .header-link:hover { color:#fff; border-color:rgba(255,255,255,0.35); background:rgba(255,255,255,0.08); }
    .header-link svg, .support-link svg { flex-shrink:0; }
    .support-link { font-size:0.8rem; font-weight:500; color:#FFD23F; text-decoration:none; display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border:1px solid rgba(200,70,9,0.45); border-radius:6px; transition:color .15s,border-color .15s,background .15s; white-space:nowrap; }
    .support-link:hover { color:#fff; background:#C84609; border-color:#C84609; }
    /* The subpage header also carries a back-link and a page title, so shed the
       optional buttons before the row can overflow. The footer keeps all three. */
    @media (max-width: 900px) { .header-actions .header-link { display:none; } }
    @media (max-width: 560px) { .header-actions { display:none; } }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="header-mark" aria-label="NYCuriosity Data home"><img src="/assets/brand/Talbot.svg" alt="" style="height:32px;width:auto;display:block"></a>
    <a href="/" class="back-link">← nycuriosity/data</a>
    <div class="header-divider"></div>
    <div class="header-title">What's New</div>
    <div class="header-actions">
      <a href="https://talroded.nycuriosity.com" class="header-link" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>About</a>
      <a href="https://www.nycuriosity.com" class="header-link" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v4H4z"/><path d="M4 10h16v10l-8-4-8 4z"/></svg>Substack</a>
      <a href="https://buymeacoffee.com/nycuriosity" class="support-link" target="_blank" rel="noopener" aria-label="Support my work on Buy Me a Coffee"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>Support my work</a>
    </div>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <div class="breadcrumb"><a href="/">data</a> / <span class="current">what's new</span></div>
    <h1>Everything that <span>shipped</span>, newest first</h1>
    <p>New tools, new chart hubs, and site changes on NYCuriosity Data. Each entry links straight to the work.</p>
  </div>
</div>

<main>
  <div class="main-inner">
    <ul class="update-list" id="update-list"></ul>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span class="footer-copy">© NYCuriosity · Tal Roded</span>
    <nav class="footer-links">
      <a href="https://talroded.nycuriosity.com" target="_blank" rel="noopener">About</a>
      <a href="https://nycuriosity.substack.com" target="_blank" rel="noopener">Substack</a>
      <a href="https://github.com/TalR24/nycur-data-website" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</footer>

<script>
(function () {
  fetch('/assets/whats-new.json')
    .then(function (r) { return r.json(); })
    .then(function (entries) {
      entries.sort(function (a, b) { return b.date < a.date ? -1 : 1; });
      var listEl = document.getElementById('update-list');
      listEl.innerHTML = entries.map(function (e) {
        return '<li class="update-item"><a href="' + e.href + '">' +
          '<span class="update-date">' + e.label + '</span>' +
          '<span class="update-title">' + e.title + '</span>' +
          '</a></li>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('update-list').innerHTML =
        '<li class="update-item"><a href="/"><span class="update-title">Updates could not load. Browse everything from the homepage.</span></a></li>';
    });
})();
</script>

</body>
</html>
