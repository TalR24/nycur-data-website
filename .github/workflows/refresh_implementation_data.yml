name: Refresh Legislation Implementation Data

on:
  schedule:
    # 1st of each month, 14:40 UTC (late morning ET). Moved off the 7:30 UTC
    # slot Aug 2026: legistar.council.nyc.gov is unresponsive early morning and
    # timed out the fiscal tracker's Jul and Aug scheduled runs from 7:00 UTC.
    # Kept 3h+ behind the fiscal refresh (11:23 UTC, Sep 26 2026) so alerts,
    # the Ask index and member/agency profiles read that same month's fiscal
    # data instead of lagging a month.
    - cron: "40 14 1 * *"
  workflow_dispatch:  # allow manual trigger from the Actions tab

# shares a group with claude_backfill.yml so the two never commit over each other
concurrency:
  group: obligations-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r civic_reference/legislation_implementation_tracker/pipeline/requirements.txt

      - name: Fetch newly enacted laws
        working-directory: civic_reference/legislation_implementation_tracker
        run: python3 pipeline/fetch_enacted_laws.py --incremental

      - name: Re-extract queued laws
        working-directory: civic_reference/legislation_implementation_tracker
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REEXTRACT_LIMIT: "200"
          REEXTRACT_WORKERS: "4"
        run: python3 pipeline/reextract_queued.py

      - name: Refresh DORIS report filing status
        working-directory: civic_reference/legislation_implementation_tracker
        continue-on-error: true
        run: python3 pipeline/build_report_filings.py

      - name: Extract obligations for new laws
        working-directory: civic_reference/legislation_implementation_tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/extract_obligations.py --incremental

      - name: Rebuild council member stats
        working-directory: civic_reference/nyc_council_legislation_trackers
        run: python3 pipeline/build_member_stats.py

      - name: Rebuild agency profiles
        working-directory: civic_reference/nyc_council_legislation_trackers
        continue-on-error: true  # a city Open Data outage should never block the monthly refresh
        run: python3 pipeline/build_agency_profiles.py

      - name: Clone Council archive
        continue-on-error: true  # a GitHub outage should never block the monthly refresh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jehiah/nyc_legislation "$RUNNER_TEMP/nyc_legislation"
          git -C "$RUNNER_TEMP/nyc_legislation" sparse-checkout set people events introduction

      - name: Rebuild member votes
        working-directory: civic_reference/nyc_council_legislation_trackers
        continue-on-error: true
        run: python3 pipeline/build_member_votes.py --archive "$RUNNER_TEMP/nyc_legislation"

      - name: Rebuild member context
        working-directory: civic_reference/nyc_council_legislation_trackers
        continue-on-error: true  # a city Open Data or GitHub outage should never block the monthly refresh
        run: python3 pipeline/build_member_context.py --archive "$RUNNER_TEMP/nyc_legislation"

      # a failed push must never lose a batch again (Sep 26 2026, copied from
      # claude_backfill.yml): the rebuilt data survives 30 days as an artifact
      - name: Upload refresh output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: monthly-refresh-output
          path: |
            civic_reference/legislation_implementation_tracker/data/laws.json
            civic_reference/legislation_implementation_tracker/data/obligations.json
            civic_reference/legislation_implementation_tracker/data/powers.json
            civic_reference/legislation_implementation_tracker/data/restated_links.json
            civic_reference/legislation_implementation_tracker/data/report_filings.json
            civic_reference/legislation_implementation_tracker/pipeline/reextract_queue.json
            civic_reference/nyc_council_legislation_trackers/data/members.json
            civic_reference/nyc_council_legislation_trackers/data/agencies.json
            civic_reference/nyc_council_legislation_trackers/data/member_votes.json
            civic_reference/nyc_council_legislation_trackers/data/member_context.json
          retention-days: 30

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civic_reference/legislation_implementation_tracker/data/laws.json \
                  civic_reference/legislation_implementation_tracker/data/obligations.json \
                  civic_reference/legislation_implementation_tracker/data/powers.json \
                  civic_reference/legislation_implementation_tracker/data/restated_links.json \
                  civic_reference/legislation_implementation_tracker/data/report_filings.json \
                  civic_reference/legislation_implementation_tracker/pipeline/reextract_queue.json \
                  civic_reference/nyc_council_legislation_trackers/data/members.json \
                  civic_reference/nyc_council_legislation_trackers/data/agencies.json \
                  civic_reference/nyc_council_legislation_trackers/data/member_votes.json \
                  civic_reference/nyc_council_legislation_trackers/data/member_context.json
          if git diff --cached --quiet; then
            echo "No data changes this month."
            exit 0
          fi
          git commit -m "Monthly legislation implementation data refresh"
          # autostash: any file the rebuild changed but this step does not
          # stage blocked the rebase before (see claude_backfill.yml, Sep 26
          # 2026). Now a stuck push fails loudly instead of exiting green.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push; then pushed=1; break; fi
            sleep $((attempt * 30))
          done
          if [ "$pushed" != 1 ]; then echo "::error::push failed after 5 attempts"; exit 1; fi

      - name: Send member alerts
        continue-on-error: true  # an alert failure should never block the Ask index rebuild
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # alert subscriptions and the alert state are members-only: they
          # live in the private premium repo (served behind Cloudflare
          # Access), never in this public repo. The trackers offer no data
          # downloads (Tal, Sep 24 2026), so no CSV is copied there.
          git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" /tmp/premium
          PREMIUM_DIR=/tmp/premium python3 civic_reference/nyc_council_legislation_trackers/pipeline/send_alerts.py
          cd /tmp/premium
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civic_reference/legislation_implementation_tracker/data/alerts_state.json
          if git diff --cached --quiet; then
            echo "Alert state unchanged."
          else
            git commit -m "Monthly refresh: alert state"
            git push
          fi

      - name: Rebuild Ask index
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: |
          # its own step (Sep 26 2026): a send_alerts failure must never skip
          # this rebuild the way one shared step did before.
          if [ ! -d /tmp/premium ]; then
            git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" /tmp/premium
          fi
          PREMIUM_DIR=/tmp/premium python3 civic_reference/nyc_council_legislation_trackers/pipeline/build_ask_index.py
          cd /tmp/premium
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker/ask_index.json
          if git diff --cached --quiet; then
            echo "Ask index unchanged."
          else
            git commit -m "Monthly refresh: Ask index"
            git push
          fi
