name: Refresh State Capacity Data

on:
  schedule:
    # 6 AM EST (11:00 UTC) / 7 AM EDT (11:00 UTC) — UTC doesn't shift with DST
    - cron: "0 11 * * *"
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # full history needed for git log timestamp comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install numpy

      - name: Check whether CSVs changed since last JSON build
        id: check
        working-directory: civic_reference/state_capacity_ecosystem
        run: |
          CSV_TIME=$(git log -1 --format="%ct" -- \
            data/directory.csv \
            data/connect_submissions.csv)
          JSON_TIME=$(git log -1 --format="%ct" -- data/affinity.json)
          echo "CSV last committed: $CSV_TIME  |  JSON last built: $JSON_TIME"
          if [ -z "$CSV_TIME" ] || [ -z "$JSON_TIME" ] || [ "$CSV_TIME" -gt "$JSON_TIME" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CSVs are newer than JSON — rebuilding."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CSV changes since last JSON build — skipping."
          fi

      - name: Snapshot previous Connect entries (before rebuild)
        if: steps.check.outputs.changed == 'true'
        run: |
          git show HEAD:civic_reference/state_capacity_ecosystem/data/connect.json \
            > /tmp/connect_prev.json 2>/dev/null || echo "[]" > /tmp/connect_prev.json

      - name: Rebuild JSON files
        if: steps.check.outputs.changed == 'true'
        working-directory: civic_reference/state_capacity_ecosystem
        run: |
          python3 data/build_affinity.py
          python3 data/build_people.py

      - name: Email new Connect entries
        if: steps.check.outputs.changed == 'true'
        working-directory: civic_reference/state_capacity_ecosystem
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 data/notify_new_connect.py \
            /tmp/connect_prev.json \
            data/connect.json

      - name: Update hardcoded stat strings
        if: steps.check.outputs.changed == 'true'
        working-directory: civic_reference/state_capacity_ecosystem
        run: python3 data/update_stats.py

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ORG=$(python3 -c "
          import json
          s = json.load(open('civic_reference/state_capacity_ecosystem/data/affinity.json'))['stats']
          print(s['org_count'])
          ")
          EDGES=$(python3 -c "
          import json
          s = json.load(open('civic_reference/state_capacity_ecosystem/data/affinity.json'))['stats']
          print(s['edge_count'])
          ")
          CONNECT=$(python3 -c "
          import json
          print(len(json.load(open('civic_reference/state_capacity_ecosystem/data/connect.json'))))
          ")

          git add \
            civic_reference/state_capacity_ecosystem/data/affinity.json \
            civic_reference/state_capacity_ecosystem/data/directory.json \
            civic_reference/state_capacity_ecosystem/data/affinity_search.json \
            civic_reference/state_capacity_ecosystem/data/connect.json \
            civic_reference/state_capacity_ecosystem/methodology/index.html \
            civic_reference/state_capacity_ecosystem/README.md \
            index.html \
            README.md

          if git diff --staged --quiet; then
            echo "Nothing staged — skipping commit."
          else
            git commit -m "Data: auto-refresh from CSV update (${ORG} orgs, ${EDGES} edges, ${CONNECT} Connect entries) [$(date -u '+%Y-%m-%d')]"
            git push
          fi
