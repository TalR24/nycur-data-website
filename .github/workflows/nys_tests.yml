name: NYS tracker tests

# The NYS pipeline tests on every push that touches the pipeline (review of Nov 10 2026, finding 12). They ran only inside
# the manual nys_extract.yml. No secrets and no model calls: the tests read fixtures and committed data only.
on:
  push:
    paths:
      - "civic_reference/nys_legislation_trackers/pipeline/**"
      - ".github/workflows/nys_tests.yml"
  workflow_dispatch:

concurrency:
  group: nys-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NYS: civic_reference/nys_legislation_trackers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: pip install -r civic_reference/legislation_implementation_tracker/pipeline/requirements.txt
      - name: Tests
        run: |
          ran=0; skipped=0
          for t in "$NYS"/pipeline/tests/*.py; do
            echo "== $t"
            python3 "$t" > /tmp/test_out.txt 2>&1 || { cat /tmp/test_out.txt; exit 1; }
            cat /tmp/test_out.txt
            ran=$((ran + 1))
            if grep -q "skipped: .*cache" /tmp/test_out.txt; then skipped=$((skipped + 1)); fi
          done
          echo "NYS test files run: $ran; skipped for the missing local cache: $skipped"
          echo "### NYS tests: $ran files run, $skipped skipped for the missing local cache" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ran" -gt 0 ] && [ "$skipped" -eq "$ran" ]; then echo "::error::every test file skipped"; exit 1; fi
