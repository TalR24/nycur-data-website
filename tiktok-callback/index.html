<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorization code — NYCuriosity</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: ui-monospace, Menlo, monospace; background: #170C03; color: #f3f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .box { max-width: 720px; text-align: center; }
    h1 { font-size: 1.1rem; margin-bottom: 18px; color: #FFD23F; }
    code { display: block; background: #1d2536; border: 1px solid #4A3B2C; border-radius: 10px; padding: 18px; font-size: 1rem; word-break: break-all; margin-bottom: 16px; }
    button { font-family: inherit; background: #CF4B0C; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 0.9rem; cursor: pointer; }
    p { color: #9A8B7A; font-size: 0.85rem; margin-top: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>NYCuriosity Shareout authorization</h1>
    <code id="code">no code in URL</code>
    <button onclick="copyCode()">Copy code</button>
    <p>Paste this code back into the terminal running the shareout tool. You can close this tab afterward.</p>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var c = params.get('code');
    if (c) document.getElementById('code').textContent = decodeURIComponent(c);
    function copyCode() {
      navigator.clipboard.writeText(document.getElementById('code').textContent).then(function () {
        document.querySelector('button').textContent = '✓ Copied';
      });
    }
  </script>
</body>
</html>
