name: Refresh Legislation Implementation Data

# BILLING: calls the Anthropic API (Sonnet), billed per token outside Claude Max.
# It runs unattended, so no session can do it; keep it to new or changed documents
# (legislation-trackers skill, "Billing", lists the cost levers).
on:
  schedule:
    # 1st of each month, 14:40 UTC (late morning ET). Moved off the 7:30 UTC
    # slot Aug 2026: legistar.council.nyc.gov is unresponsive early morning and
    # timed out the fiscal tracker's Jul and Aug scheduled runs from 7:00 UTC.
    # Kept 3h+ behind the fiscal refresh (11:23 UTC, Sep 26 2026) so alerts,
    # the Ask index and member/agency profiles read that same month's fiscal
    # data instead of lagging a month.
    - cron: "40 14 1 * *"
    # Cheap resume-only run, days 2-7: exits immediately when no batch is
    # pending (batch_state_new.json and batch_state_reextract.json absent). Makes no other API call. Covers a
    # batch that was still processing when the monthly run's job cap hit.
    - cron: "0 13 2-7 * *"
  workflow_dispatch:  # allow manual trigger from the Actions tab
    inputs:
      sync:
        description: "Force synchronous (non-batch) extraction instead of the default batch mode"
        type: boolean
        default: false

# shares a group with claude_backfill.yml so the two never commit over each other
concurrency:
  group: obligations-data
  cancel-in-progress: false

jobs:
  refresh:
    # the resume-only cron does not run the full monthly job (see the
    # "resume" job below); this job runs on the 1st and on manual dispatch
    if: github.event.schedule != '0 13 2-7 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Budget arithmetic (Sep 28 2026, must fit the 360-min job cap):
    #   re-extraction batch wait   <= 120 min (max_wait_s in reextract_queued.py)
    #   new-laws batch wait        <= 120 min (max_wait_s in extract_obligations.py)
    #   fetch/scrape/DORIS/members/agencies/archive clone/votes/context steps
    #                               ~ 30-60 min combined, historically
    #   commit + push retries      ~  5 min
    #   ---------------------------------------
    #   total                     <= 305-345 min, under the 360-min cap
    # Either batch step returning None (still pending after its own wait)
    # exits its script early rather than blocking on the other, so the two
    # waits are sequential worst cases, not additive beyond the 240 min above.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r civic_reference/legislation_implementation_tracker/pipeline/requirements.txt

      - name: Fetch newly enacted laws
        working-directory: civic_reference/legislation_implementation_tracker
        run: python3 pipeline/fetch_enacted_laws.py --incremental

      # BILLING: batch mode (default here) is half price on every token and
      # caches the fixed instructions (~0.1x price on every request after the
      # first); a manual "sync" dispatch input can force the old synchronous
      # path (still cached, just not batched) for a same-day result.
      - name: Re-extract queued laws
        working-directory: civic_reference/legislation_implementation_tracker
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REEXTRACT_LIMIT: "200"
          REEXTRACT_WORKERS: "4"
          CLAUDE_BATCH: ${{ github.event.inputs.sync == 'true' && '0' || '1' }}
        run: python3 pipeline/reextract_queued.py

      - name: Refresh DORIS report filing status
        working-directory: civic_reference/legislation_implementation_tracker
        continue-on-error: true
        run: python3 pipeline/build_report_filings.py

      # BILLING: same batch + caching as above.
      - name: Extract obligations for new laws
        working-directory: civic_reference/legislation_implementation_tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BATCH: ${{ github.event.inputs.sync == 'true' && '0' || '1' }}
        run: python3 pipeline/extract_obligations.py --incremental

      - name: Rebuild council member stats
        working-directory: civic_reference/nyc_council_legislation_trackers
        run: python3 pipeline/build_member_stats.py

      - name: Rebuild agency profiles
        working-directory: civic_reference/nyc_council_legislation_trackers
        continue-on-error: true  # a city Open Data outage should never block the monthly refresh
        run: python3 pipeline/build_agency_profiles.py

      - name: Clone Council archive
        continue-on-error: true  # a GitHub outage should never block the monthly refresh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jehiah/nyc_legislation "$RUNNER_TEMP/nyc_legislation"
          git -C "$RUNNER_TEMP/nyc_legislation" sparse-checkout set people events introduction

      - name: Rebuild member votes
        working-directory: civic_reference/nyc_council_legislation_trackers
        continue-on-error: true
        run: python3 pipeline/build_member_votes.py --archive "$RUNNER_TEMP/nyc_legislation"

      - name: Rebuild member context
        working-directory: civic_reference/nyc_council_legislation_trackers
        continue-on-error: true  # a city Open Data or GitHub outage should never block the monthly refresh
        run: python3 pipeline/build_member_context.py --archive "$RUNNER_TEMP/nyc_legislation"

      # a failed push must never lose a batch again (Sep 26 2026, copied from
      # claude_backfill.yml): the rebuilt data survives 30 days as an artifact
      - name: Upload refresh output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: monthly-refresh-output
          path: |
            civic_reference/legislation_implementation_tracker/data/laws.json
            civic_reference/legislation_implementation_tracker/data/obligations.json
            civic_reference/legislation_implementation_tracker/data/powers.json
            civic_reference/legislation_implementation_tracker/data/restated_links.json
            civic_reference/legislation_implementation_tracker/data/summary.json
            civic_reference/legislation_implementation_tracker/data/report_filings.json
            civic_reference/legislation_implementation_tracker/pipeline/reextract_queue.json
            civic_reference/legislation_implementation_tracker/pipeline/batch_state_new.json
            civic_reference/legislation_implementation_tracker/pipeline/batch_state_reextract.json
            civic_reference/nyc_council_legislation_trackers/data/members.json
            civic_reference/nyc_council_legislation_trackers/data/agencies.json
            civic_reference/nyc_council_legislation_trackers/data/member_votes.json
            civic_reference/nyc_council_legislation_trackers/data/member_context.json
          retention-days: 30

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civic_reference/legislation_implementation_tracker/data/laws.json \
                  civic_reference/legislation_implementation_tracker/data/obligations.json \
                  civic_reference/legislation_implementation_tracker/data/powers.json \
                  civic_reference/legislation_implementation_tracker/data/restated_links.json \
                  civic_reference/legislation_implementation_tracker/data/summary.json \
                  civic_reference/legislation_implementation_tracker/data/report_filings.json \
                  civic_reference/legislation_implementation_tracker/pipeline/reextract_queue.json \
                  civic_reference/nyc_council_legislation_trackers/data/members.json \
                  civic_reference/nyc_council_legislation_trackers/data/agencies.json \
                  civic_reference/nyc_council_legislation_trackers/data/member_votes.json \
                  civic_reference/nyc_council_legislation_trackers/data/member_context.json
          # batch_state_new.json / batch_state_reextract.json exist only
          # while their batch is pending: `-A` stages the file whether this
          # run created it, changed it, or (clear_state, batch done) deleted
          # it. A plain `git add <path>` on an already-deleted, never-tracked
          # path is a no-op, so a completed batch's deletion never committed
          # without this (Sep 28 2026 review).
          for f in civic_reference/legislation_implementation_tracker/pipeline/batch_state_new.json \
                  civic_reference/legislation_implementation_tracker/pipeline/batch_state_reextract.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1 || [ -f "$f" ]; then
              git add -A -- "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No data changes this month."
            exit 0
          fi
          git commit -m "Monthly legislation implementation data refresh"
          # autostash: any file the rebuild changed but this step does not
          # stage blocked the rebase before (see claude_backfill.yml, Sep 26
          # 2026). Now a stuck push fails loudly instead of exiting green.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push; then pushed=1; break; fi
            sleep $((attempt * 30))
          done
          if [ "$pushed" != 1 ]; then echo "::error::push failed after 5 attempts"; exit 1; fi

      - name: Send member alerts
        continue-on-error: true  # an alert failure should never block the Ask index rebuild
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # alert subscriptions and the alert state are members-only: they
          # live in the private premium repo (served behind Cloudflare
          # Access), never in this public repo. The trackers offer no data
          # downloads (Tal, Sep 24 2026), so no CSV is copied there.
          git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" /tmp/premium
          PREMIUM_DIR=/tmp/premium python3 civic_reference/nyc_council_legislation_trackers/pipeline/send_alerts.py
          cd /tmp/premium
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civic_reference/legislation_implementation_tracker/data/alerts_state.json
          if git diff --cached --quiet; then
            echo "Alert state unchanged."
          else
            git commit -m "Monthly refresh: alert state"
            git push
          fi

      - name: Rebuild Ask index
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: |
          # its own step (Sep 26 2026): a send_alerts failure must never skip
          # this rebuild the way one shared step did before.
          if [ ! -d /tmp/premium ]; then
            git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" /tmp/premium
          fi
          PREMIUM_DIR=/tmp/premium python3 civic_reference/nyc_council_legislation_trackers/pipeline/build_ask_index.py
          cd /tmp/premium
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker/ask_index.json
          if git diff --cached --quiet; then
            echo "Ask index unchanged."
          else
            git commit -m "Monthly refresh: Ask index"
            git push
          fi

  # Cheap daily check, days 2-7 of the month: resumes a batch left pending by
  # the monthly run (its 360-min cap can be hit by a batch still processing).
  # Exits immediately, no other API call, when neither state file exists.
  resume:
    if: github.event.schedule == '0 13 2-7 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r civic_reference/legislation_implementation_tracker/pipeline/requirements.txt

      # BILLING: this resumes a pending batch (still half price, still
      # cached); it makes no new API call when neither state file is present.
      # Each script only resumes its OWN state file (reextract_queued.py:
      # batch_state_reextract.json; extract_obligations.py: batch_state_new.
      # json), so a pending new-laws batch is not re-submitted as a
      # re-extraction batch or vice versa.
      - name: Resume pending batches, if any
        working-directory: civic_reference/legislation_implementation_tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BATCH: "1"
        run: |
          did_anything=0
          if [ -f pipeline/batch_state_reextract.json ]; then
            python3 pipeline/reextract_queued.py
            did_anything=1
          fi
          if [ -f pipeline/batch_state_new.json ]; then
            python3 pipeline/extract_obligations.py --incremental
            did_anything=1
          fi
          if [ "$did_anything" = 0 ]; then
            echo "no pending batch; nothing to do"
            exit 0
          fi
          echo "RESUME_RAN=1" >> "$GITHUB_ENV"

      - name: Rebuild council member stats
        if: env.RESUME_RAN == '1'
        working-directory: civic_reference/nyc_council_legislation_trackers
        run: python3 pipeline/build_member_stats.py

      - name: Rebuild agency profiles
        if: env.RESUME_RAN == '1'
        working-directory: civic_reference/nyc_council_legislation_trackers
        continue-on-error: true
        run: python3 pipeline/build_agency_profiles.py

      - name: Commit and push if resume produced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civic_reference/legislation_implementation_tracker/data/obligations.json \
                  civic_reference/legislation_implementation_tracker/data/powers.json \
                  civic_reference/legislation_implementation_tracker/data/summary.json \
                  civic_reference/legislation_implementation_tracker/pipeline/reextract_queue.json \
                  civic_reference/nyc_council_legislation_trackers/data/members.json \
                  civic_reference/nyc_council_legislation_trackers/data/agencies.json
          # -A so a completed batch's state-file DELETION (clear_state) is
          # staged too, not just a creation or a content change.
          for f in civic_reference/legislation_implementation_tracker/pipeline/batch_state_new.json \
                  civic_reference/legislation_implementation_tracker/pipeline/batch_state_reextract.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1 || [ -f "$f" ]; then
              git add -A -- "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Resume pending legislation implementation batch"
          git -c rebase.autoStash=true pull --rebase origin main && git push
