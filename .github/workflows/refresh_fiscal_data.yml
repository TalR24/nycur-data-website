name: Refresh NYC Council Fiscal Impacts

on:
  schedule:
    # 1st of each month, 15:23 UTC (late morning ET). The old 7:00 UTC slot
    # hit legistar.council.nyc.gov's unresponsive early-morning window and the
    # search request timed out on both Jul and Aug 2026 scheduled runs.
    - cron: "23 15 1 * *"
  workflow_dispatch:
    inputs:
      incremental:
        description: "Skip already-processed matters"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run fiscal impacts pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          INCREMENTAL="${{ github.event.inputs.incremental || 'true' }}"
          FLAGS=""
          if [ "$INCREMENTAL" = "true" ]; then FLAGS="--incremental"; fi
          echo "Running: python pipeline/fetch_fiscal_impacts.py $FLAGS"
          python pipeline/fetch_fiscal_impacts.py $FLAGS

      - name: Regenerate agency chart data
        run: python pipeline/regenerate_agency_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civic_reference/nyc_council_fiscal_impacts_tracker/data/fiscal_impacts.json \
                  civic_reference/nyc_council_fiscal_impacts_tracker/agency-fiscal-impact/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(python3 -c "import json; d=json.load(open('civic_reference/nyc_council_fiscal_impacts_tracker/data/fiscal_impacts.json')); print(d['metadata']['total_records'])")
            git commit -m "data: refresh fiscal impacts — $COUNT records [$(date -u '+%Y-%m-%d')]"
            git push
          fi
