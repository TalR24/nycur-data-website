name: Mention Monitor

# Delivery (Oct 17 2026): the daily collect runs are unchanged. On Sundays the
# digest is no longer emailed when DIGEST_DELIVERY=file: it is written to
# mention_monitor_state/digests/YYYY-MM-DD.{html,txt,json} in the premium repo
# and the Sunday cloud routine folds it into ONE Sunday week-ahead email. If the
# write or push fails, the digest is emailed directly, and
# sunday_brief_fallback.yml emails the raw digests if the routine's brief never
# lands. Set DIGEST_DELIVERY=email below to restore the direct email. The "run
# failed" alert is unchanged.
# Billing: no Anthropic API.

on:
  schedule:
    - cron: "30 11 * * *"   # daily ~6:30-7:30am ET; Sundays send the digest
  workflow_dispatch:
    inputs:
      backfill:
        description: "Seed the seen-db from ~90 days back (no digest, no email)"
        type: boolean
        default: false
      digest:
        description: "Build and write the digest from pending items"
        type: boolean
        default: false
      send_email:
        description: "Email the digest when it runs (implies digest; scheduled Sunday runs always email)"
        type: boolean
        default: false
      referrers_only:
        description: "Run only the Cloudflare referrer source and print its rows/error; no other source, no db writes"
        type: boolean
        default: false
      referrers_window_hours:
        description: "How far back referrers_only looks, in hours (default 24)"
        default: "24"

permissions:
  contents: read   # state commits go to the private repo via PREMIUM_PUSH_TOKEN

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      DIGEST_DELIVERY: ${{ github.event_name == 'schedule' && 'file' || 'email' }}   # scheduled runs feed the Sunday brief; manual dispatch emails directly
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r mention_monitor/requirements.txt

      - name: Run offline tests
        env:
          MENTION_MONITOR_SKIP_LIVE_TESTS: "1"
        run: python3 -m unittest discover -s mention_monitor -p "test_monitor.py" -v

      # State (seen.db, digests, discovered_sources.json) lives in the private
      # premium repo: digests list who cited Tal and must not be public.
      - name: Check out private state
        env:
          PREMIUM_PUSH_TOKEN: ${{ secrets.PREMIUM_PUSH_TOKEN }}
        run: |
          git clone --depth 1 "https://TalR24:${PREMIUM_PUSH_TOKEN}@github.com/TalR24/nycur-data-premium.git" "$RUNNER_TEMP/premium"
          mkdir -p "$RUNNER_TEMP/premium/mention_monitor_state/digests"
          echo "STATE_DIR=$RUNNER_TEMP/premium/mention_monitor_state" >> "$GITHUB_ENV"

      - name: Determine if today is Sunday
        id: day
        run: echo "is_digest_day=$([ "$(date -u +%u)" = "7" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run mention monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MENTION_DIGEST_TO: ${{ secrets.MENTION_DIGEST_TO }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GOOGLE_ALERT_FEEDS: ${{ secrets.GOOGLE_ALERT_FEEDS }}
        # referrers_only runs the Cloudflare referrer probe alone, nothing
        # else. Otherwise: digest fires on a scheduled Sunday run, or when
        # explicitly asked for via workflow_dispatch (inputs.digest), or
        # whenever send_email is requested (send_email implies digest,
        # since emailing with no digest built is a no-op). Email follows
        # the same Sunday/send_email rule. A manual dispatch on a Sunday
        # must NOT auto-add --digest/--email just because is_digest_day is true.
        run: |
          STATE_ARGS="--db $STATE_DIR/seen.db --outdir $STATE_DIR/digests --discovered-path $STATE_DIR/discovered_sources.json"
          if [ "${{ inputs.referrers_only }}" = "true" ]; then
            python3 mention_monitor/monitor.py $STATE_ARGS --referrers-only --referrers-window-hours ${{ inputs.referrers_window_hours || '24' }}
          else
            python3 mention_monitor/monitor.py $STATE_ARGS \
              ${{ inputs.backfill && '--backfill' || '' }} \
              ${{ (!inputs.backfill && ((github.event_name == 'schedule' && steps.day.outputs.is_digest_day == 'true') || inputs.digest || inputs.send_email)) && '--digest' || '' }} \
              ${{ (!inputs.backfill && ((github.event_name == 'schedule' && steps.day.outputs.is_digest_day == 'true') || inputs.send_email)) && '--email' || '' }}
          fi

      # Commit even if the email step inside the script failed — the seen-db
      # and pending table must advance or the next run double-reports.
      # A failed run means no digest and no email, which looks the same as a
      # quiet week. Say so directly.
      - name: Email on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MENTION_DIGEST_TO: ${{ secrets.MENTION_DIGEST_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, smtplib
          from email.mime.text import MIMEText
          user, pw = os.environ.get("GMAIL_USER"), os.environ.get("GMAIL_APP_PASSWORD")
          if user and pw:
              msg = MIMEText("The mention monitor run failed. Nothing was collected or "
                             "emailed today.\n\n" + os.environ["RUN_URL"] + "\n")
              msg["Subject"] = "Mention monitor run failed"
              msg["From"] = user
              msg["To"] = os.environ.get("MENTION_DIGEST_TO") or user
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as s:
                  s.login(user, pw); s.send_message(msg)
              print("Failure email sent.")
          EOF

      - name: Commit state to the private repo
        id: commit
        if: always()
        run: |
          cd "$RUNNER_TEMP/premium"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A on the directory: collect-only and backfill runs update seen.db
          # but write no digest, and a missing literal pathspec is fatal.
          git add -A mention_monitor_state
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Mention monitor: update state and digest"
            if ! git pull --rebase origin main || ! git push; then
              echo "push_ok=false" >> "$GITHUB_OUTPUT"
              echo "::error::Could not push to the premium repo; the next step emails the digest."
              exit 1
            fi
          fi

      # Never lose a digest: in file mode a failed push leaves it only on this
      # runner, so email it directly (only on days a digest email was due).
      - name: Email the digest if the premium push failed
        if: ${{ always() && steps.commit.outputs.push_ok == 'false' && env.DIGEST_DELIVERY == 'file' && ((github.event_name == 'schedule' && steps.day.outputs.is_digest_day == 'true') || inputs.send_email) }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MENTION_DIGEST_TO: ${{ secrets.MENTION_DIGEST_TO }}
        run: |
          D="$STATE_DIR/digests/$(date -u +%Y-%m-%d)"
          test -f "$D.txt" || { echo "No digest was written (quiet week or earlier failure); nothing to email."; exit 0; }
          python3 ops_digest/assemble.py --send-files --subject "NYCuriosity mention digest (premium push failed)" --txt "$D.txt" --html "$D.html"
